name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    # Habilitamos pnpm de forma nativa con Corepack (Evita errores de la acción externa v4)
    - name: Enable PNPM via Corepack
      run: |
        corepack enable
        corepack prepare pnpm@latest --activate

    # Instalamos dependencias tolerando sutiles variaciones del lockfile local
    - name: Install dependencies
      run: pnpm install

    # Instalamos los binarios del navegador de Playwright con sus dependencias del sistema
    - name: Install Playwright Browsers
      run: pnpm playwright install --with-deps

    # Lanzamos el proceso de testing
    - name: Run Playwright tests
      run: pnpm playwright test

    # Subimos el reporte si se generaron pruebas
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30