name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 5 # Bajamos el timeout a 5 min para que no te consuma minutos de GitHub si algo falla
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    # 1. Habilitamos pnpm de forma nativa con Corepack
    - name: Enable PNPM via Corepack
      run: |
        corepack enable
        corepack prepare pnpm@latest --activate

    # 2. Instalamos de forma limpia e ignorando ciclos pesados
    - name: Install dependencies
      run: pnpm install --ignore-scripts

    # 3. Instalamos los binarios del navegador de Playwright
    - name: Install Playwright Browsers
      run: pnpm playwright install --with-deps

    # 4. LA CLAVE: Forzamos la URL de Vercel por comando saltándonos cualquier lógica del config.ts
    - name: Run Playwright tests against Vercel
      run: pnpm playwright test --config=playwright.config.ts --url=https://localmarket-cinco.vercel.app