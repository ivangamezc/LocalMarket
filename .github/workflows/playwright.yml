name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    # Activamos pnpm de forma nativa
    - name: Enable PNPM via Corepack
      run: |
        corepack enable
        corepack prepare pnpm@latest --activate

    # Instalamos solo las librerías base de testing (sin ejecutar scripts pesados de Astro/Sharp)
    - name: Install dependencies without building
      run: pnpm install --ignore-scripts

    # Descargamos los navegadores virtuales
    - name: Install Playwright Browsers
      run: pnpm playwright install --with-deps

    # Ejecutamos las pruebas apuntando a tu URL de Vercel
    - name: Run Playwright tests
      run: pnpm playwright test