name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    # Habilitamos pnpm de forma nativa con Corepack
    - name: Enable PNPM via Corepack
      run: |
        corepack enable
        corepack prepare pnpm@latest --activate

    # SOLUCIÓN AL BLOQUEO: Configuramos pnpm para que permita los scripts de compilación en CI
    - name: Configure PNPM build permissions
      run: pnpm config set allowed-built-dependencies "*"

    # Instalamos las dependencias (Ahora sí pasará de largo de esbuild y sharp)
    - name: Install dependencies
      run: pnpm install

    # Compilación de Astro
    - name: Build Astro application
      run: pnpm build
      env:
        ASTRO_TELEMETRY_DISABLED: 1

    # Instalamos los binarios del navegador de Playwright
    - name: Install Playwright Browsers
      run: pnpm playwright install --with-deps

    # Lanzamos las pruebas
    - name: Run Playwright tests
      run: pnpm playwright test

    # Guardamos reportes pase lo que pase
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30