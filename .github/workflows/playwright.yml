name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    # Habilitamos pnpm de forma nativa con Corepack
    - name: Enable PNPM via Corepack
      run: |
        corepack enable
        corepack prepare pnpm@latest --activate

    # Instalamos dependencias ignorando los scripts conflictivos de Astro
    - name: Install dependencies
      run: pnpm install --ignore-scripts

    # Instalamos los binarios del navegador de Playwright
    - name: Install Playwright Browsers
      run: pnpm playwright install --with-deps

    # Lanzamos las pruebas inyectando la URL de Vercel correcta directamente en el proceso
    - name: Run Playwright tests against Vercel
      run: pnpm playwright test
      env:
        PLAYWRIGHT_TEST_BASE_URL: https://local-market-ten.vercel.app/