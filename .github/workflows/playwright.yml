name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    # Habilitamos pnpm de forma nativa con Corepack
    - name: Enable PNPM via Corepack
      run: |
        corepack enable
        corepack prepare pnpm@latest --activate

    # Instalamos las dependencias
    - name: Install dependencies
      run: pnpm install

    # COMPILACIÓN DE ASTRO: Clave para que pnpm preview funcione
    - name: Build Astro application
      run: pnpm build
      env:
        ASTRO_TELEMETRY_DISABLED: 1 # Desactiva prompts interactivos en CI

    # Instalamos los binarios del navegador de Playwright
    - name: Install Playwright Browsers
      run: pnpm playwright install --with-deps

    # Lanzamos las pruebas (Playwright ejecutará pnpm preview solo)
    - name: Run Playwright tests
      run: pnpm playwright test

    # Guardamos reportes pase lo que pase
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30