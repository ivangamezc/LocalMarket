name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    # Habilitamos pnpm mediante Corepack nativo para resolver las dependencias de los tests
    - name: Enable PNPM via Corepack
      run: |
        corepack enable
        corepack prepare pnpm@latest --activate

    # Instalamos las dependencias necesarias de Playwright (sin compilar la app)
    - name: Install dependencies
      run: pnpm install

    # Instalamos los navegadores requeridos y sus librerías de sistema en Linux
    - name: Install Playwright Browsers
      run: pnpm playwright install --with-deps

    # Ejecutamos las pruebas directamente contra la URL de Vercel ya desplegada
    - name: Run Playwright tests
      run: pnpm playwright test

    # Guardamos y publicamos el reporte en el panel de GitHub Actions si algo falla
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30